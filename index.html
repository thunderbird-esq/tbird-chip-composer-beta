<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderbird Chiptune Composer</title>
    <link rel="stylesheet" href="styles/system.css">
    <link rel="stylesheet" href="styles/fonts.css"> <!-- Keep fonts.css for now -->
    <link rel="stylesheet" href="styles/core.css">
    <link rel="stylesheet" href="styles/grid.css">
    <link rel="stylesheet" href="styles/panels.css">
</head>
<body>
    <div id="app-container">
        <header id="app-header">
            <!-- Minimalist header, actual content might be dynamic or simple -->
            <!-- System.css doesn't have a global app header style, title-bar is per-window -->
        </header>
        <main id="main-content" class="main-layout">
            <!-- This div will act as a flex container for the two main columns -->
            <div id="left-column" class="layout-column">
                <div id="tracker-grid-container" class="window">
                    <!-- TrackerGrid will render its own title bar and content pane -->
                </div>
                <div id="visualizer-container" class="window">
                    <!-- Visualizer might render its own title bar or just content pane -->
                </div>
            </div>
            <div id="right-column" class="layout-column">
                <div id="control-panels-container">
                    <!-- PanelManager will render multiple .window elements here -->
                </div>
            </div>
        </main>
        <div id="global-status-message" style="text-align: center; padding: 2px; min-height: 1.5em; font-family: Geneva_9, sans-serif; background-color: #fff; border-top: 1px solid #000; border-bottom: 1px solid #000; margin: 2px 0;"></div>
        <div id="transport-controls-container" class="transport-bar">
            <!-- Buttons here will be styled by system.css -->
        </div>
        <footer id="app-footer">
             <!-- Minimalist footer -->
        </footer>
    </div>

    <script type="module" src="src/constants.js" defer></script>
    <script type="module" src="src/audio/engine.js" defer></script>
    <script type="module" src="src/audio/generators.js" defer></script>
    <script type="module" src="src/audio/instruments.js" defer></script>
    <script type="module" src="src/audio/effects.js" defer></script>
    <script type="module" src="src/ui/grid.js" defer></script>
    <script type="module" src="src/ui/panels.js" defer></script>
    <script type="module" src="src/ui/transport.js" defer></script>
    <script type="module" src="src/ui/visualizer.js" defer></script>
    <script type="module" src="src/utils/file-io.js" defer></script>
    <script type="module" src="src/utils/formatters.js" defer></script>
    <script type="module" src="src/utils/midi-export.js" defer></script>
    <script type="module" src="src/utils/midi-import.js" defer></script>
    <script src="serviceWorker.js" defer></script>
    <script type="module" src="src/main.js" defer></script>
</body>
</html>
