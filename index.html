<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderbird Chiptune Composer</title>
    <link rel="stylesheet" href="./styles/system.css">
    <!-- <link rel="stylesheet" href="./styles/fonts.css"> --> <!-- Keep fonts.css for now -->
    <!-- <link rel="stylesheet" href="./styles/core.css"> -->
    <!-- <link rel="stylesheet" href="./styles/grid.css"> -->
    <!-- <link rel="stylesheet" href="./styles/panels.css"> -->
</head>
<body>
    <div id="app-container">
        <header id="app-header">
            <!-- Minimalist header, actual content might be dynamic or simple -->
            <!-- System.css doesn't have a global app header style, title-bar is per-window -->
        </header>
        <main id="main-content" class="main-layout">
            <!-- This div will act as a flex container for the two main columns -->
            <div id="left-column" class="layout-column">
                <div id="tracker-grid-container" class="window">
                    <!-- TrackerGrid will render its own title bar and content pane -->
                </div>
                <div id="visualizer-container" class="window">
                    <!-- Visualizer might render its own title bar or just content pane -->
                </div>
            </div>
            <div id="right-column" class="layout-column">
                <div id="control-panels-container">
                    <!-- PanelManager will render multiple .window elements here -->
                </div>
            </div>
        </main>
        <div id="global-status-message" style="text-align: center; padding: 2px; min-height: 1.5em; font-family: Geneva_9, sans-serif; background-color: #fff; border-top: 1px solid #000; border-bottom: 1px solid #000; margin: 2px 0;"></div>
        <div id="transport-controls-container" class="transport-bar">
            <!-- Buttons here will be styled by system.css -->
        </div>
        <footer id="app-footer">
             <!-- Minimalist footer -->
        </footer>
    </div>
    <style>
        /* Basic flex layout for main-content - system.css is component-focused */
        body { display: flex; flex-direction: column; min-height: 100vh; }
        #app-container { display: flex; flex-direction: column; flex-grow: 1; }
        .main-layout { display: flex; flex-grow: 1; padding: 5px; gap: 5px; overflow: hidden; }
        .layout-column { display: flex; flex-direction: column; gap: 5px; }
        #left-column { flex: 3; } /* Adjust ratio as needed */
        #right-column { flex: 1; display: flex; flex-direction: column; }
        #control-panels-container { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex-grow: 1;}
        #tracker-grid-container { flex-grow: 3; display: flex; flex-direction: column; } /* Allow grid to take more space */
        #visualizer-container { flex-grow: 1; display: flex; flex-direction: column; min-height: 100px; } /* Ensure visualizer has some min height */
        .transport-bar { padding: 5px; background-color: #ccc; /* Placeholder bg */ display: flex; justify-content: center; gap: 5px; border-top: 1px solid #000; }
        /* Ensure windows fill their containers */
        .window { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }

        /* Custom styles for UI elements to complement system.css */
        .tracker-grid-table .selected-cell {
            background-color: #000 !important; /* Black background for selection */
            color: #fff !important; /* White text for selection */
            outline: 1px dashed #fff; /* Dashed outline for selected cell */
            outline-offset: -1px;
        }

        .tracker-grid-table .playing-row {
            background-color: #c0c0c0 !important; /* A light gray, different from default window bg */
            /* You might want to ensure text color contrasts well, e.g., color: #000; */
        }

        .tracker-grid-table .playing-row td.row-number {
            background-color: #a0a0a0 !important; /* Darker gray for playing row number */
            color: #000 !important;
        }

        .btn.recording-active {
            background: #000; /* Inverted style like system.css active buttons */
            color: #fff;
            /* system.css .btn:active also adds a border-radius: 6px, we can add it or let it be */
        }

        /* Ensure grid cell input is styled for editing with system.css focus */
        /* input.grid-cell-input is already handled by system.css input:focus-visible */

    </style>

    <script type="module" src="src/constants.js" defer></script>
    <script type="module" src="src/audio/engine.js" defer></script>
    <script type="module" src="src/audio/generators.js" defer></script>
    <script type="module" src="src/audio/instruments.js" defer></script>
    <script type="module" src="src/audio/effects.js" defer></script>
    <script type="module" src="src/ui/grid.js" defer></script>
    <script type="module" src="src/ui/panels.js" defer></script>
    <script type="module" src="src/ui/transport.js" defer></script>
    <script type="module" src="src/ui/visualizer.js" defer></script>
    <script type="module" src="src/utils/file-io.js" defer></script>
    <script type="module" src="src/utils/formatters.js" defer></script>
    <script type="module" src="src/utils/midi-export.js" defer></script>
    <script type="module" src="src/utils/midi-import.js" defer></script>
    <script src="serviceWorker.js" defer></script>
    <script type="module" src="src/main.js" defer></script>
</body>
</html>
