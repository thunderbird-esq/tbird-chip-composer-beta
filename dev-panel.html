
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev Panel - Chiptune Composer</title>
  <link rel="stylesheet" href="styles/system.css">
  <link rel="stylesheet" href="styles/core.css">
  <link rel="stylesheet" href="styles/fonts.css">
</head>
<body>
  <div class="window" style="width: 300px;">
    <div class="title-bar">
      <div class="title-bar-text">Dev Panel</div>
    </div>
    <div class="window-body">
      <h1>🎛️ Chiptune Dev Panel</h1>
      <p>Use this page to interact with key modules manually.</p>
      <button onclick="playClick()">🔊 Play click.wav</button>
    </div>
  </div>
  <script>
    function playClick() {
      const audio = new Audio('assets/sfx/click.wav');
      audio.play();
    }
  </script>
</body>
